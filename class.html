    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            padding: 60px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            color: #cbd5e0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        section {
            margin-bottom: 40px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        section h2 {
            color: #1f4068;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }
        .skills-list li {
            background: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .project {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .project:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .project h3 {
            color: #162447;
            margin-bottom: 5px;
        }
        .project a {
            color: #30475e;
            text-decoration: none;
            font-weight: bold;
        }
        .project a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #718096;
            font-size: 0.9rem;
        }

      .split-container {
  display: flex;
  width: 100%;
  height: 400px; /* Adjust height as needed */
}

/* Both halves get an equal share of the space */
.left-half, .right-half {
  flex: 1; 
  padding: 20px;
}

/* Optional colors to visually see the split */
.left-half {
  background-color: #f4f4f4;
}

.right-half {
  background-color: #e0e0e0;
}
